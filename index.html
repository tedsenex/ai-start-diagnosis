<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>AI 時代起步診斷</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700;900&family=Quicksand:wght@500;700&family=Unbounded:wght@800;900&display=swap">
<style>
/* Layout: poster-portfolio grammar — warm off-white paper, ink-black outlines, rounded panels, one big orange colour block per view, hashtag pills, round chevron buttons. Views: home → talk (answer panel in page flow, never fixed) → report. */
:root{
  --paper:#EEE9E1; --surface:#FBF8F3; --ink:#16130F; --muted:#6E655B; --hair:#CDC4B8;
  --accent:#F2551D; --accent-ink:#FFFFFF; --accent-soft:#FBE0D2; --sun:#F6A623; --sun-soft:#FBEBCB;
  --calm:#3E7B57; --good:#3E7B57; --warn:#B86A0B; --bad:#D23A1A; --warn-soft:#FBEBCB; --bad-soft:#FBE0D2;
  --sunk:#E3DCD2; --line:#16130F;
  --f-display:"Unbounded","Noto Sans TC",system-ui,sans-serif;
  --f-zh:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-body:"Quicksand","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --bw:1.5px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#171411; --surface:#211D19; --ink:#F2ECE3; --muted:#A79C90; --hair:#3B342D;
  --accent:#FF6A33; --accent-ink:#FFFFFF; --accent-soft:#3D2316; --sun:#F6B04A; --sun-soft:#3A2D16;
  --calm:#6DBB8C; --good:#6DBB8C; --warn:#F0A54A; --bad:#FF7350; --warn-soft:#3A2D16; --bad-soft:#3D2316;
  --sunk:#2C2722; --line:#F2ECE3; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#171411; --surface:#211D19; --ink:#F2ECE3; --muted:#A79C90; --hair:#3B342D;
  --accent:#FF6A33; --accent-ink:#FFFFFF; --accent-soft:#3D2316; --sun:#F6B04A; --sun-soft:#3A2D16;
  --calm:#6DBB8C; --good:#6DBB8C; --warn:#F0A54A; --bad:#FF7350; --warn-soft:#3A2D16; --bad-soft:#3D2316;
  --sunk:#2C2722; --line:#F2ECE3; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;font-weight:500;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
button{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;width:100%}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.zh{font-family:var(--f-zh)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;line-height:1;padding:5px 10px;border-radius:999px;background:var(--ink);color:var(--paper);white-space:nowrap}
.pill.o{background:var(--accent);color:var(--accent-ink)}
.pill.line{background:none;color:var(--ink);border:var(--bw) solid var(--ink)}
.chev{flex:none;width:26px;height:26px;border-radius:50%;border:var(--bw) solid var(--ink);display:inline-grid;place-items:center;background:none;cursor:pointer;padding:0}
.chev svg{width:12px;height:12px;transition:transform .2s}
.collapsed .chev svg{transform:rotate(-90deg)}
.ava{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--ink);background:var(--surface);color:var(--ink);display:grid;place-items:center;font-family:var(--f-zh);font-weight:900;font-size:16px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:var(--bw) solid var(--ink);padding-block:10px}
.top-row{display:flex;align-items:center;gap:12px}
.mark{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.logo{flex:none;width:40px;height:40px;display:block}
.mark-t{min-width:0;line-height:1.25}
.mark-t b{display:block;font-family:var(--f-zh);font-size:14.5px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mark-t span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link-btn{flex:none;background:none;border:var(--bw) solid var(--ink);border-radius:999px;padding:5px 14px;font-size:13px;font-weight:700;cursor:pointer}
.link-btn:hover{background:var(--ink);color:var(--paper)}
.prog{margin-top:10px;display:grid;gap:6px}
.prog-dots{display:flex;gap:4px}
.prog-dots i{flex:1;height:5px;border-radius:3px;background:var(--hair)}
.prog-dots i.done{background:var(--ink)}
.prog-dots i.on{background:var(--accent)}
.prog-meta{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--muted)}
.prog-meta b{color:var(--ink);font-family:var(--f-zh);font-weight:900}
.prog-meta .num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
main{padding-block:20px 48px}

/* home */
.home{display:grid;gap:22px}
.poster{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:20px;align-items:end}
.poster-l{display:grid;gap:14px;align-content:end}
.arrow{width:96px;height:96px;color:var(--ink)}
.tags{display:grid;gap:0}
.tags span{display:block;padding:7px 0;border-bottom:var(--bw) solid var(--hair);font-size:15px;text-align:right;white-space:nowrap}
.tags span:last-child{border-color:var(--ink)}
.block{position:relative;aspect-ratio:1/1;max-width:100%;border-radius:24px;background:var(--accent);color:var(--accent-ink);overflow:hidden;container-type:inline-size}
.block .b-ai{position:absolute;right:6%;top:2%;font-family:var(--f-display);font-weight:900;font-size:52cqw;line-height:.95;letter-spacing:-.04em}
.block .b-zh{position:absolute;left:7%;bottom:20%;font-family:var(--f-zh);font-weight:900;font-size:21cqw;line-height:1.05;writing-mode:horizontal-tb}
.block .b-yr{position:absolute;left:7%;bottom:6%;font-family:var(--f-display);font-weight:800;font-size:7.5cqw;letter-spacing:.02em}
.block .b-tag{position:absolute;right:6%;bottom:7%;font-size:3.6cqw;font-weight:700;border:2px solid currentColor;border-radius:999px;padding:.4em .9em}
.headline{display:flex;align-items:center;justify-content:space-between;gap:12px;border-block:var(--bw) solid var(--ink);padding-block:12px}
.headline h1{margin:0;font-family:var(--f-zh);font-weight:900;font-size:clamp(22px,5.4vw,32px);line-height:1.3;text-wrap:balance}
.headline h1 em{font-style:normal;color:var(--accent)}
.round{flex:none;width:40px;height:40px;border-radius:50%;border:var(--bw) solid var(--ink);display:grid;place-items:center}
.round svg{width:16px;height:16px}
.duo{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:14px}
.hello{background:var(--ink);color:var(--paper);border-radius:22px;padding:20px;display:grid;align-content:space-between;gap:18px;min-height:240px}
.hello small{font-size:13px;opacity:.75}
.hello b{display:block;font-family:var(--f-zh);font-weight:900;font-size:clamp(28px,6vw,38px);line-height:1.15}
.hello p{margin:0;font-size:12.5px;opacity:.8;line-height:1.6}
.hello .role{display:inline-block;margin-top:10px;font-size:12px;font-weight:700;line-height:1;padding:5px 11px;border-radius:999px;background:var(--accent);color:var(--accent-ink)}
.hello ul{margin:0;padding:0;list-style:none;display:grid;gap:9px;font-family:var(--f-zh);font-size:13.5px;line-height:1.55}
.hello li{display:grid;grid-template-columns:14px 1fr;gap:4px}
.hello li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:6px}
.hello .solo{opacity:1;font-family:var(--f-zh);font-weight:700;font-size:13.5px;padding-top:12px;border-top:1px solid color-mix(in srgb,var(--paper) 30%,transparent)}
.quote{margin:0;padding-left:14px;border-left:3px solid var(--accent);display:grid;gap:8px;font-family:var(--f-zh);font-size:15.5px;font-weight:500;line-height:1.75}
.quote p{margin:0}
.quote cite{font-style:normal;font-size:13px;font-weight:700;color:var(--muted)}
.quote cite::before{content:"— "}
.panel{background:var(--surface);border:var(--bw) solid var(--ink);border-radius:22px;padding:16px 18px;display:grid;gap:8px;min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.panel-h h2,.panel-h h3{margin:0;font-family:var(--f-zh);font-weight:900;font-size:19px;line-height:1.35}
.panel p{margin:0}
.muted{color:var(--muted)}
.sech{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.sech h2{margin:0;font-family:var(--f-zh);font-weight:900;font-size:22px}
.paths{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.path{all:unset;box-sizing:border-box;cursor:pointer;border-radius:22px;padding:18px;display:grid;gap:10px;align-content:start;transition:transform .15s}
.path:hover{transform:translateY(-3px)}
.path:focus-visible{outline:2.5px solid var(--accent);outline-offset:3px}
.path.ink{background:var(--ink);color:var(--paper)}
.path.ink .pill{background:var(--paper);color:var(--ink)}
.path.org{background:var(--accent);color:var(--accent-ink)}
.path.org .pill{background:var(--accent-ink);color:var(--accent)}
.path .ico{width:36px;height:36px}
.path b{font-family:var(--f-zh);font-weight:900;font-size:24px;line-height:1.3}
.path p{margin:0;font-size:14px;opacity:.85}
.path .rule{height:0;border-top:2px solid currentColor;opacity:.9;position:relative;margin:4px 0}
.path .rule::before,.path .rule::after{content:"";position:absolute;top:-4px;width:6px;height:6px;border-radius:50%;background:currentColor}
.path .rule::before{left:0}.path .rule::after{right:0}
.path .foot{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700}
.gets{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.get{border:var(--bw) solid var(--ink);border-radius:18px;padding:14px;display:grid;gap:6px;align-content:start;background:var(--surface);min-width:0}
.get b{font-family:var(--f-zh);font-weight:900;font-size:15.5px}
.get span{font-size:13px;color:var(--muted);line-height:1.6}
.resume{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--sun-soft);border:var(--bw) solid var(--ink);border-radius:18px;padding:12px 16px}
.resume p{margin:0;flex:1;min-width:180px}
.fine{font-size:12.5px;color:var(--muted);margin:0}

/* thread */
.thread{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:flex-end;max-width:92%}
.row .ava{width:30px;height:30px;font-size:14px;margin-bottom:2px}
.row.cont .ava{visibility:hidden}
.bub{background:var(--surface);border:var(--bw) solid var(--ink);border-radius:18px 18px 18px 6px;padding:10px 14px;min-width:0}
.bub .qid{display:inline-block;font-family:var(--f-body);font-size:11px;font-weight:700;line-height:1;padding:4px 8px;border-radius:999px;background:var(--ink);color:var(--paper);margin-right:8px;vertical-align:2px}
.bub .q{font-family:var(--f-zh);font-size:16px;font-weight:700;line-height:1.6}
.bub .hint{display:block;font-size:13px;color:var(--muted);margin-top:4px}
.bub.calm{background:var(--sun-soft)}
.bub.calm::before{content:"緩解一下";display:inline-block;font-size:11px;font-weight:700;line-height:1;padding:4px 9px;border-radius:999px;background:var(--sun);color:#2A1A05;margin-bottom:6px}
.bub.note{background:transparent;border:var(--bw) dashed var(--hair);color:var(--muted);font-size:14px}
.me{align-self:flex-end;max-width:80%;background:var(--accent);color:var(--accent-ink);border-radius:18px 18px 6px 18px;padding:8px 15px;font-size:14.5px;font-weight:700}
.chap{align-self:stretch;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:16px 0 4px;padding-bottom:8px;border-bottom:var(--bw) solid var(--ink)}
.chap div{display:grid;gap:4px}
.chap em{font-style:normal}
.chap b{font-family:var(--f-zh);font-weight:900;font-size:22px;line-height:1.25}
.chap .round{width:32px;height:32px}
.past .bub,.past .me{opacity:.66}
.typing{display:inline-flex;gap:4px;padding:4px 2px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--ink);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
.pop{animation:pop .22s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* answer panel (in page flow) */
.dock{margin-top:14px;background:var(--surface);border:2px solid var(--ink);border-radius:22px;padding:14px;box-shadow:5px 5px 0 var(--ink)}
.dock-body{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:center;text-align:left;width:100%;background:var(--surface);border:var(--bw) solid var(--ink);border-radius:14px;padding:11px 14px;cursor:pointer;transition:background .12s;font-family:var(--f-zh);font-size:15px;font-weight:500;line-height:1.5}
.opt:hover{background:var(--accent-soft)}
.opt kbd{flex:none;font-family:var(--f-body);font-size:12px;font-weight:700;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:var(--bw) solid var(--ink)}
.opt[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt[aria-pressed="true"] kbd{background:var(--accent-ink);color:var(--accent);border-color:var(--accent-ink)}
.lk{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.lk button{background:var(--surface);border:var(--bw) solid var(--ink);border-radius:14px;padding:12px 0;cursor:pointer;font-family:var(--f-display);font-size:18px;font-weight:800}
.lk button:hover{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.lk-ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.field{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:stretch}
.field input{width:100%;min-width:0;font:inherit;font-size:16px;padding:11px 14px;border-radius:14px;border:var(--bw) solid var(--ink);background:var(--paper);color:var(--ink)}
.field input:focus{outline:2.5px solid var(--accent);outline-offset:1px}
.field .btn{min-width:76px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--ink);color:var(--paper);border:var(--bw) solid var(--ink);border-radius:999px;padding:10px 20px;font-weight:700;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn.o{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none;color:var(--ink)}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.dock-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;font-size:12.5px;color:var(--muted)}
.dock-foot button{background:none;border:0;color:var(--muted);cursor:pointer;padding:4px 0;font-weight:700}
.dock-foot button:hover{color:var(--ink)}
.err{color:var(--bad);font-size:13px}
.kbd-hint{display:none}
@media (hover:hover) and (min-width:700px){.kbd-hint{display:inline}}

#pick,#book{scroll-margin-top:96px}
/* report */
.rep{display:grid;gap:16px}
.hero{background:var(--accent);color:var(--accent-ink);border-radius:26px;padding:22px;display:grid;gap:16px;position:relative;overflow:hidden}
.hero .eyebrow{font-size:12.5px;font-weight:700;opacity:.9}
.hero-top{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.grade{width:92px;height:92px;border-radius:50%;border:3px solid currentColor;display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:50px;line-height:1}
.grade.word{font-family:var(--f-zh);font-size:22px}
.hero h2{margin:0;font-family:var(--f-zh);font-weight:900;font-size:26px;line-height:1.3;text-wrap:balance}
.hero p{margin:6px 0 0;font-size:14.5px;opacity:.92}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:#16130F;color:#F6F1EA;border-radius:16px;padding:12px;min-width:0;display:grid;gap:6px;align-content:start}
.tile em{font-style:normal;justify-self:start;font-size:11px;font-weight:700;line-height:1;padding:4px 8px;border-radius:999px;background:#F6F1EA;color:#16130F}
.tile b{display:block;font-family:var(--f-display);font-weight:800;font-size:24px;font-variant-numeric:tabular-nums;line-height:1.2}
.tile b small{font-size:11px;opacity:.6}
.tile b.txt{font-family:var(--f-zh);font-weight:900;font-size:16px;line-height:1.45}
.hero .btn{justify-self:start;background:var(--accent-ink);color:var(--accent);border-color:var(--accent-ink)}
.sec{background:var(--surface);border:var(--bw) solid var(--ink);border-radius:22px;padding:18px 20px;display:grid;gap:12px;min-width:0}
.sec>h3{margin:0;display:flex;align-items:center;gap:10px;font-family:var(--f-zh);font-weight:900;font-size:19px;line-height:1.35;cursor:pointer}
.sec>h3 small{font-family:var(--f-body);font-weight:700;font-size:10.5px;letter-spacing:.08em;color:var(--muted);flex:1}
.sec.collapsed>*:not(h3){display:none}
.sec p{margin:0}
.viz{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:center}
.viz>*{min-width:0}
.viz svg{width:100%;height:auto;display:block}
.dims{display:grid;gap:9px}
.dim{display:grid;grid-template-columns:5.6em 1fr auto;gap:10px;align-items:center;font-size:14px;font-family:var(--f-zh)}
.dim .bar{height:10px;border-radius:5px;border:var(--bw) solid var(--ink);overflow:hidden;background:var(--surface)}
.dim .bar b{display:block;height:100%;background:var(--ink)}
.dim.low .bar b{background:var(--accent)}
.dim .n{font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.dim.low span:first-child{color:var(--accent);font-weight:700}
.anx{background:var(--sun-soft)}
.anx-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.anx-top b{font-family:var(--f-display);font-weight:900;font-size:44px;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.anx-top span{font-family:var(--f-zh);font-weight:900}
.meter{position:relative;height:12px;border-radius:6px;border:var(--bw) solid var(--ink);background:linear-gradient(90deg,var(--calm),var(--sun),var(--accent))}
.meter i{position:absolute;top:-6px;width:6px;height:20px;border-radius:3px;background:var(--ink);transform:translateX(-50%);box-shadow:0 0 0 2px var(--surface)}
.meter-l{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.steps{margin:0;padding:0;list-style:none;display:grid;gap:8px;counter-reset:s}
.steps li{display:grid;grid-template-columns:26px 1fr;gap:8px;counter-increment:s;font-size:14.5px;font-family:var(--f-zh)}
.steps li::before{content:counter(s);width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--paper);font-family:var(--f-body);font-weight:700;font-size:12px;display:grid;place-items:center;margin-top:2px}
.flag{border:var(--bw) solid var(--ink);border-radius:16px;padding:12px 14px;display:grid;gap:4px;background:var(--bad-soft)}
.flag b::before{content:"紅旗";display:inline-block;font-size:11px;font-weight:700;line-height:1;padding:4px 8px;border-radius:999px;background:var(--bad);color:#fff;margin-right:8px;vertical-align:2px}
.flag.warn{background:var(--warn-soft)}
.flag.warn b::before{content:"注意";background:var(--sun);color:#2A1A05}
.flag span{font-size:14px;color:var(--muted)}
.list{display:grid;gap:10px}
.card{border:var(--bw) solid var(--ink);border-radius:16px;padding:12px 14px;display:grid;gap:4px;font-family:var(--f-zh)}
.card .meta{font-size:13px;color:var(--muted)}
.card .meta span{color:var(--ink);font-weight:700}
.card .pct{display:inline-block;font-family:var(--f-body);font-size:11px;font-weight:700;line-height:1;padding:4px 8px;border-radius:999px;background:var(--ink);color:var(--paper);margin-left:8px;vertical-align:2px}
.plan{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.plan div{background:#16130F;color:#F6F1EA;border-radius:18px;padding:14px;font-size:14px;min-width:0;display:grid;gap:6px;align-content:start;font-family:var(--f-zh)}
.plan em{font-style:normal;justify-self:start;font-family:var(--f-body);font-size:11px;font-weight:700;line-height:1;padding:4px 8px;border-radius:999px;background:#F6F1EA;color:#16130F}
.plan b{font-weight:900;font-size:15.5px}
.plan span{opacity:.85;font-size:13.5px;line-height:1.6}
.foot-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.copied{font-size:13px;color:var(--good);font-weight:700}
.book{border-width:2px;box-shadow:5px 5px 0 var(--accent)}
.book label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.book input,.book textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:var(--bw) solid var(--ink);border-radius:12px;padding:9px 12px;width:100%}
.book input:focus,.book textarea:focus{outline:2.5px solid var(--accent);outline-offset:1px}
.book textarea{min-height:80px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;background:none;border:var(--bw) solid var(--ink);border-radius:999px;padding:5px 14px;cursor:pointer;font-size:14px;font-weight:700}
.chips button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.out{white-space:pre-wrap;background:var(--paper);border:var(--bw) dashed var(--ink);border-radius:12px;padding:12px 14px;font-size:14px;font-family:var(--f-zh)}
.contact code{font-family:var(--f-mono);background:var(--paper);padding:1px 6px;border-radius:4px}

@media (max-width:620px){
 .poster{grid-template-columns:1fr}.poster-l{order:2;grid-template-columns:auto 1fr;align-items:end}.arrow{width:64px;height:64px}
 .duo,.paths,.gets,.viz,.plan,.two{grid-template-columns:1fr}
 .hello{min-height:0}
 .hero-top{grid-template-columns:auto 1fr}.grade{width:70px;height:70px;font-size:38px}.grade.word{font-size:17px}
 .hero h2{font-size:21px}.tiles{gap:6px}.tile{padding:10px 9px}.tile b{font-size:19px}.tile b.txt{font-size:14px}
 .row{max-width:96%}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>

let S={path:null,ans:{}};
const KEY='ai-start-v2';
try{const s=localStorage.getItem(KEY);if(s){const o=JSON.parse(s);if(o&&o.ans)S=o}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const P=()=>PATHS[S.path];
const DIMOF=k=>P().dims.find(d=>d.k===k);
const applicable=q=>!q.when||q.when(S.ans);
const txt=q=>typeof q.text==='function'?q.text(S.ans):q.text;
function runway(a){const e=+((a.r_exp||{}).v),s=+((a.r_save||{}).v);if(!(e>0))return 0;return s/e}
function runwayScore(m){return m<3?1:m<6?2:m<12?3:m<18?4:5}
function score(q,a){if(!a)return null;
 if(q.type==='choice')return q.options[a.v][1];
 if(q.type==='likert')return q.rev?6-a.v:a.v;
 if(q.type==='skill')return 1+a.v*4/3;
 if(q.id==='r_save')return runwayScore(runway(S.ans));
 return null}
const sc=id=>{const q=P().qs.find(x=>x.id===id);return q&&applicable(q)?score(q,S.ans[id]):null};
const avg=xs=>{xs=xs.filter(x=>x!=null);return xs.length?xs.reduce((s,x)=>s+x,0)/xs.length:null};
function dimAvg(d){const qs=P().qs.filter(q=>q.dim===d.k&&applicable(q));
 if(!d.g)return avg(qs.map(q=>score(q,S.ans[q.id])));
 let t=0,w=0;for(const[g,gw]of Object.entries(d.g)){const v=avg(qs.filter(q=>q.g===g).map(q=>score(q,S.ans[q.id])));if(v!=null){t+=v*gw;w+=gw}}
 return w?t/w:null}
function compute(){return P().dims.map(d=>{const a=dimAvg(d);const pct=a==null?0:(a-1)/4;return{...d,avg:a,pct,pts:pct*d.w}})}
function weakest(){const r=compute().filter(d=>d.k!=='C'&&d.avg!=null);r.sort((x,y)=>x.pct-y.pct);return r[0]}
function anxiety(){const v=P().qs.filter(q=>q.type==='choice'&&S.ans[q.id]&&q.options[S.ans[q.id].v][2]!=null).map(q=>q.options[S.ans[q.id].v][2]);return v.length?Math.round(avg(v)*100):null}
const live=()=>P().qs.filter(applicable);
const nextQ=()=>live().find(q=>!S.ans[q.id]);

 botMsg(S.path==='a'?'好，我們從 AI 開始聊，再一路看到動機、能力、資源和生活。照「實際做過的」回答就好，沒有標準答案。':'好，我陪你找出公司最痛的地方，以及 AI 適合從哪裡切入。照公司現況回答就好。');

 for(const q of live()){const a=S.ans[q.id];
  if(q.pre&&!pre){pre=true;thread.append(el('div','chap',`<div><em><span class="pill o">開始之前</span></em><b>先認識你</b></div><span class="chev" aria-hidden="true">${ICON.chev}</span>`));lastWasBot=false}

  botMsg(qHtml(q));
  if(!a)return q;
  meMsg(a.label);if(q.react){const r=q.react(a,S.ans);if(r)botMsg(esc(r),q.calm?'calm':'note')}
 }
 return null}

function progress(q){const all=live(),done=all.filter(x=>S.ans[x.id]).length;
 const d=q&&q.dim?DIMOF(q.dim):null;const di=d?P().dims.indexOf(d):-1;

async function answer(q,v,label){if(busy)return;busy=true;

 if(q.react){const r=q.react(S.ans[q.id],S.ans);if(r){await typing();botMsg(esc(r),q.calm?'calm':'note',true);toBottom(true);await wait(350)}}

 if(n.dim&&n.dim!==q.dim){const d=DIMOF(n.dim);await wait(150);chap(d,true);await typing();botMsg(esc(d.intro),'note',true)}
 else if(n.dim&&q.pre){const d=DIMOF(n.dim);chap(d,true);await typing();botMsg(esc(d.intro),'note',true)}
 await typing();botMsg(qHtml(n),'',true);markPast();progress(n);showDock(n);toBottom(true);busy=false}

  const upd=()=>{ok.disabled=!picked.size;ok.textContent=picked.size?`確定，已選 ${picked.size} 項`:`請選 1–${q.max} 項`};upd();

  <div><h2>${esc(name)}，你目前是「${g[2]}」</h2><p>${g[3]}${gi>base?`　總分可到 ${GR[base][1]} 級，因${fl.length?'紅旗':''}${fl.length&&short.length?'與':''}${short.length?'短板':''}調為 ${g[1]} 級。`:''}</p></div></div>
  <div class="tiles"><div class="tile"><em>準備度</em><b>${total.toFixed(0)}<small style="font-size:12px;opacity:.7"> /100</small></b></div>
  <div class="tile"><em>AI 焦慮指數</em><b>${anx??'—'}</b></div><div class="tile"><em>建議路徑</em><b class="txt">${PATH[pk][0]}</b></div></div><button class="btn" type="button" data-book>預約一對一，聊你的結果 ↓</button></section>
 ${anxSec()}
 ${fl.length?`<section class="sec"><h3>先處理這些紅旗<small>${fl.length} RED FLAGS</small></h3><div class="list">${fl.map(f=>`<div class="flag"><b>${f[0]}</b><span>${f[1]}建議：${f[2]}</span></div>`).join('')}</div></section>`:''}
 <section class="sec"><h3>九個面向的得分<small>SCORE BY AREA</small></h3><div class="viz"><div>${radar(r)}</div>${dimBars(r)}</div></section>
 <section class="sec"><h3>建議路徑：${PATH[pk][0]}<small>FIT × READINESS</small></h3><div class="viz"><div>${quad(fit,ready)}</div><div style="display:grid;gap:8px"><p>${PATH[pk][1]}</p><p class="fine">適配度看 AI 適應力、動機、個性、能力、教練性；準備度看資源、驗證、團隊、生活。兩軸以 60% 為分界。</p></div></div></section>
 <section class="sec"><h3>你的類型：${TYPE[tk][0]}<small>BUILDER TYPE</small></h3><p>${TYPE[tk][1]}</p><p class="fine">建議補位：${TYPE[tk][2]}</p></section>
 <section class="sec"><h3>你的優勢<small>STRENGTHS</small></h3>${strengths.length?`<div class="list">${strengths.map(d=>`<div class="card"><b>${d.n}<span class="pct">${Math.round(d.pct*100)}%</span></b><span>${STRONG[d.k]}</span></div>`).join('')}</div>`:'<p class="fine">目前沒有超過 50% 的面向。先從下面的補強開始，優勢會在過程中浮現。</p>'}</section>
 <section class="sec"><h3>先補這三件事<small>GAPS</small></h3><div class="list">${gaps.map(d=>`<div class="card"><b>${RX[d.k][0]}<span class="pct">${d.n} ${Math.round(d.pct*100)}%</span></b><span>${RX[d.k][1]}</span><div class="meta">期限 <span>${RX[d.k][2]}</span>　檢核 <span>${RX[d.k][3]}</span></div></div>`).join('')}
  ${must.length?`<div class="card"><b>必要技能需要補位：${must.join('、')}</b><span>能賣、能算、能交付是第一年的最低門檻。這幾項你標為「不會」，需要夥伴、外包或 AI 工具負責。</span></div>`:''}</div></section>
 <section class="sec"><h3>90 天行動計畫<small>NEXT 90 DAYS</small></h3><div class="plan">${steps.map((s,i)=>`<div><em>第 ${i*30+1}–${i*30+30} 天</em><b>${s[0]}</b><span>${s[1]}</span></div>`).join('')}</div><p class="fine">第 90 天重做一次這份診斷，比較前後的雷達圖。</p></section>`;
 const summary=`${g[1]} 級・${g[2]}（${total.toFixed(1)} 分）${anx!=null?`；AI 焦慮指數 ${anx}`:''}`;
 const need=['想創業','做自媒體','自媒體＋事業'][S.ans.kind?S.ans.kind.v:0];
 R.append(booking(summary,[...fl.map(f=>f[0]),...gaps.map(d=>RX[d.k][0])].slice(0,3).join('、'),need));
 R.append(tools([`AI 時代起步診斷｜${name}｜${P().label}`,`等級 ${g[1]}：${g[2]}（${total.toFixed(1)} / 100）`,anx!=null?`AI 焦慮指數：${anx}（${anxLv(anx)}）`:'',
  ...(fl.length?['','【紅旗】',...fl.map(f=>`・${f[0]}：${f[2]}`)]:[]),'','【各面向】',...r.map(d=>`・${d.n} ${d.pts.toFixed(1)} / ${d.w}${d.pct<.4?'（短板）':''}`),
  '',`【建議路徑】${PATH[pk][0]}：${PATH[pk][1]}`,`【類型】${TYPE[tk][0]}：${TYPE[tk][2]}`,'','【先補】',...gaps.map(d=>`・${RX[d.k][0]}：${RX[d.k][1]}`),
  '','【90 天】',...steps.map((s,i)=>`・第 ${i*30+1}–${i*30+30} 天：${s[0]}，${s[1]}`)]),sign())}

/* ===================== 報告 B ===================== */
const STAGE=[[80,'擴散期','基礎、團隊和條件都到位，可以從單點試點擴大到跨部門流程。'],[60,'試點期','條件大致具備，適合挑一個痛點做 2–4 週試點，用數字證明成效。'],[40,'摸索期','有意願也有零星嘗試，但缺少痛點排序和推動機制。先把方向收斂。'],[0,'觀望期','還在觀望，焦慮多於方向。先從主管自己用起、訂好規範，再談導入。']];
function notesB(){const a=S.ans,f=[];
 if(a.g3&&a.g3.v===0&&a.h1&&a.h1.v>=2)f.push(['bad','資料外洩風險','已經有員工在用 AI，但公司沒有使用規範。','優先訂一頁 AI 使用規範，標明哪些資料不能交給 AI。']);
 if(a.h1&&a.h1.v===0)f.push(['warn','團隊抗拒','員工對 AI 普遍抗拒或擔心被取代。','先從「幫員工省事」的場景切入，避免一開始就談人力精簡。']);
 if(a.h2&&a.h2.v===0&&a.g2&&a.g2.v===0)f.push(['warn','沒有推動者也沒有預算','AI 導入沒有負責人，也還沒有預算。','先指定一位推動者，給他每週固定時間，再談工具和預算。']);
 if(a.d2&&a.d2.v===0)f.push(['warn','資料散落','客戶與營運資料散在 LINE、紙本和個人電腦。','先把最常用的一份資料集中起來，AI 才有東西可以分析。']);
 if(a.g1&&a.g1.v===0)f.push(['warn','需要說服決策者','AI 導入需要說服老闆。','用一個小試點的前後數字去說服，比簡報更有效。']);
 return f}
function reportB(){
 const r=compute(),total=r.reduce((s,d)=>s+d.pts,0),st=STAGE.find(s=>total>=s[0]),nt=notesB(),anx=anxiety();
 const name=S.ans.name&&S.ans.name.v||'你',pains=(S.ans.k1?S.ans.k1.v:[]).map(i=>PAINS[i]);
 const hours=S.ans.k3?S.ans.k3.label:'不清楚',weak=[...r].sort((a,b)=>a.pct-b.pct)[0],first=pains[0];
 const plan=[['盤點與規範',`訂一頁 AI 使用規範；${first?first[3]:'列出 3 個最痛、最重複的流程'}。主管先每天用 AI。`],
  ['單點試點',`針對「${first?first[1]:'最痛的流程'}」做 2–4 週試點：${first?first[2]:'挑一個兩週內看得到成效的流程'}。記錄導入前後的工時與成果。`],
  ['擴散與內化','把試點做法寫成 SOP，辦一場內部工作坊，挑下一個痛點複製同樣的方法。']];
 const R=$('report');R.innerHTML=`
 <section class="hero"><div class="eyebrow">AI 導入準備度報告・${[S.ans.size,S.ans.ind].filter(Boolean).map(x=>esc(x.label)).join('・')}</div>
  <div class="hero-top"><div class="grade word" aria-label="階段 ${st[1]}">${st[1]}</div>
  <div><h2>${esc(name)}，公司目前在「${st[1]}」</h2><p>${st[2]}</p></div></div>
  <div class="tiles"><div class="tile"><em>導入準備度</em><b>${total.toFixed(0)}<small style="font-size:12px;opacity:.7"> /100</small></b></div>
  <div class="tile"><em>AI 焦慮指數</em><b>${anx??'—'}</b></div><div class="tile"><em>重複工時／週</em><b class="txt">${esc(hours)}</b></div></div><button class="btn" type="button" data-book>預約一對一，聊導入規劃 ↓</button></section>
 ${anxSec()}
 <section class="sec"><h3>你們最痛的地方，AI 可以這樣幫<small>PAIN → AI</small></h3><div class="list">${pains.map((p,i)=>`<div class="card"><b>${i+1}. ${p[1]}</b><span>${p[2]}</span><div class="meta">這週先做：<span>${p[3]}</span></div></div>`).join('')}</div>
  <p class="fine">${S.ans.k3&&S.ans.k3.v>0?`團隊每週約有「${esc(hours)}」花在重複性工作上。這是 AI 最容易先接手的部分，也是試點最好衡量成效的指標。`:'建議先記錄一週的重複性工時，這個數字會是衡量 AI 成效的基準。'}</p></section>
 ${nt.length?`<section class="sec"><h3>導入前先注意<small>WATCH-OUTS</small></h3><div class="list">${nt.map(f=>`<div class="flag ${f[0]==='warn'?'warn':''}"><b>${f[1]}</b><span>${f[2]}建議：${f[3]}</span></div>`).join('')}</div></section>`:''}
 <section class="sec"><h3>五個面向的得分<small>READINESS BY AREA</small></h3><div class="viz"><div>${radar(r)}</div><div style="display:grid;gap:10px">${dimBars(r)}<p class="fine">最需要先補的是「${weak.n}」。</p></div></div></section>
 <section class="sec"><h3>90 天導入路線<small>NEXT 90 DAYS</small></h3><div class="plan">${plan.map((s,i)=>`<div><em>第 ${i*30+1}–${i*30+30} 天</em><b>${s[0]}</b><span>${s[1]}</span></div>`).join('')}</div></section>`;
 const summary=`${st[1]}（${total.toFixed(1)} 分）${anx!=null?`；AI 焦慮指數 ${anx}`:''}`;
 R.append(booking(summary,pains.map(p=>p[1]).join('、'),`企業 AI 導入（${[S.ans.role,S.ans.size].filter(Boolean).map(x=>x.label).join('・')}）`));
 R.append(tools([`AI 導入準備度診斷｜${name}｜${P().label}`,`階段：${st[1]}（${total.toFixed(1)} / 100）`,anx!=null?`AI 焦慮指數：${anx}（${anxLv(anx)}）`:'',
  '','【痛點與 AI 做法】',...pains.map(p=>`・${p[1]}：${p[2]}（這週先做：${p[3]}）`),`・每週重複性工時：${hours}`,
  ...(nt.length?['','【導入前先注意】',...nt.map(f=>`・${f[1]}：${f[3]}`)]:[]),'','【各面向】',...r.map(d=>`・${d.n} ${d.pts.toFixed(1)} / ${d.w}`),
  '','【90 天】',...plan.map((s,i)=>`・第 ${i*30+1}–${i*30+30} 天 ${s[0]}：${s[1]}`)]),sign())}

function report(){keyMap=null;view('report');(S.path==='a'?reportA:reportB)();$('report').querySelectorAll('[data-book]').forEach(b=>b.onclick=goBook);$('report').querySelectorAll('.sec>h3').forEach(h=>{const b=el('button','chev',ICON.chev);b.type='button';b.setAttribute('aria-label','收合或展開');b.setAttribute('aria-expanded','true');h.append(b);h.onclick=()=>{const c=h.parentElement.classList.toggle('collapsed');b.setAttribute('aria-expanded',c?'false':'true')}});window.scrollTo({top:0})}
function goBook(){const b=$('book');if(b){b.scrollIntoView({behavior:RM?'auto':'smooth',block:'start'});setTimeout(()=>{const i=$('bk-contact');if(i)i.focus({preventScroll:true})},RM?0:450)}};
function reset(){S={path:null,ans:{}};save();home()}
$('restart').onclick=reset;

/* 啟動：做完的直接看報告，做到一半回首頁顯示「繼續作答」 */
if(S.path&&PATHS[S.path]&&!nextQ())report();else{if(S.path&&!PATHS[S.path])S={path:null,ans:{}};home()}
</script>
